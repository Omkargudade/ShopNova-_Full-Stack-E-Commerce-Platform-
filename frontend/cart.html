<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart - ShopNova</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .cart-layout {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
        }
        .cart-items-section {
            flex: 2;
        }
        .cart-summary-section {
            flex: 1;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">ShopNova</a>
        <div class="nav-links" id="auth-links"></div>
    </nav>

    <div class="container">
        <h2>Your Cart</h2>
        
        <div class="cart-layout">
            <div class="cart-items-section" id="cart-items">
                <p>Loading cart...</p>
            </div>
            
            <div class="cart-summary-section">
                <div class="cart-summary">
                    <h3>Total</h3>
                    <div style="display: flex; justify-content: space-between; margin-top: 1rem; margin-bottom: 1rem; border-bottom: 1px solid #ddd; padding-bottom: 1rem;">
                        <span>Sub-Total</span>
                        <strong id="order-total">Rs. 0</strong>
                    </div>
                    <div style="margin-bottom: 1.5rem;">
                        <span style="font-size: 0.9rem; color: #555;">Delivery: Standard Delivery (Free)</span>
                    </div>
                    <button class="btn btn-primary w-100" onclick="placeOrder()" style="padding: 1rem; font-size: 1.1rem;">Check Out</button>
                    
                    <div style="margin-top: 2rem; text-align: center;">
                        <span style="font-size: 0.9rem; color: #888;">We Accept</span>
                        <div style="display: flex; justify-content: center; gap: 0.5rem; margin-top: 0.5rem;">
                            <!-- Placeholder icons -->
                            <div style="width: 40px; height: 25px; background: #eee; border-radius: 4px;"></div>
                            <div style="width: 40px; height: 25px; background: #eee; border-radius: 4px;"></div>
                            <div style="width: 40px; height: 25px; background: #eee; border-radius: 4px;"></div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/cart.js"></script>
    <script src="js/chat.js"></script>
</body>
</html>
