<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - ShopNova</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">ShopNova</a>
        <div class="nav-links">
            <a href="signup.html" class="btn btn-primary">Sign Up</a>
        </div>
    </nav>

    <div class="container">
        <div class="form-container">
            <h2>Login</h2>
            <div id="auth-error" class="hidden text-center" style="color: red; margin-bottom: 1rem;"></div>
            <form id="loginForm">
                <div class="form-group">
                    <label for="email">Email ID</label>
                    <input type="email" id="email" required>
                </div>
                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" required>
                </div>
                <button type="submit" class="btn btn-primary w-100 mt-3">Login</button>
                <div class="text-center mt-3">
                    <a href="#" class="text-muted" style="font-size: 0.9rem;">Forgot password?</a>
                </div>
                <div class="text-center mt-3">
                    <span class="text-muted">Don't have an account?</span>
                    <a href="signup.html" style="color: var(--primary-color); text-decoration: none;">Create new</a>
                </div>
            </form>
        </div>
    </div>

    <script src="js/api.js?v=1.1"></script>
    <script src="js/app.js?v=1.1"></script>
    <script src="js/auth.js?v=1.1"></script>
</body>
</html>
