<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Wishlist - ShopNova</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .wishlist-empty {
            text-align: center;
            padding: 3rem 0;
        }
        .wishlist-empty svg {
            width: 80px;
            height: 80px;
            fill: #ccc;
            margin-bottom: 1rem;
        }
        .wishlist-item-card {
            position: relative;
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">ShopNova</a>
        <div class="nav-links" id="auth-links"></div>
    </nav>

    <div class="container">
        <h2>My Wishlist ❤️</h2>
        
        <div id="wishlist-grid" class="product-grid" style="margin-top: 2rem;">
            <p>Loading your wishlist...</p>
        </div>
    </div>

    <script src="js/api.js?v=1.1"></script>
    <script src="js/app.js?v=1.1"></script>
    <script src="js/cart.js?v=1.1"></script>
    <script src="js/wishlist.js?v=1.1"></script>
    <script src="js/chat.js?v=1.1"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const userId = localStorage.getItem('userId');
            const grid = document.getElementById('wishlist-grid');
            if (!userId) {
                grid.innerHTML = `
                    <div class="wishlist-empty">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <h3>Please log in to view your wishlist.</h3>
                        <a href="login.html" class="btn btn-primary" style="margin-top: 1rem;">Login Now</a>
                    </div>
                `;
                return;
            }

            try {
                const products = await fetchAPI(`/wishlist/${userId}`, 'GET');
                renderWishlist(products);
            } catch (err) {
                console.error('Failed to load wishlist', err);
                grid.innerHTML = '<p class="text-center text-muted">Failed to load wishlist. Please check if the backend is running.</p>';
            }
        });

        function renderWishlist(products) {
            const grid = document.getElementById('wishlist-grid');
            grid.innerHTML = '';

            if (!products || products.length === 0) {
                grid.innerHTML = `
                    <div class="wishlist-empty" style="grid-column: 1/-1;">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                        <h3>Your wishlist is empty</h3>
                        <p class="text-muted" style="margin-top: 0.5rem;">Explore our products and tap the heart icon to save your favorites!</p>
                        <a href="index.html" class="btn btn-primary" style="margin-top: 1rem;">Start Shopping</a>
                    </div>
                `;
                return;
            }

            products.forEach(p => {
                const card = document.createElement('div');
                card.className = 'product-card wishlist-item-card';
                card.addEventListener('click', () => {
                    window.location.href = `product.html?id=${p.id}`;
                });

                card.innerHTML = `
                    <button class="wishlist-btn active" type="button" aria-label="Remove from Wishlist">
                        <svg viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>
                    </button>
                    <img src="${p.imageUrl || 'https://via.placeholder.com/250x200'}" onerror="this.onerror=null;this.src='https://via.placeholder.com/250x200';" alt="${p.name}" class="product-img">
                    <div class="product-category">${p.brand ? p.brand + ' - ' : ''}${p.category || 'General'}</div>
                    <h3 class="product-title">${p.name}</h3>
                    <div class="product-price">Rs. ${Number(p.price).toLocaleString()}</div>
                    <div style="display: flex; gap: 0.5rem; margin-top: auto;">
                        <button class="btn btn-primary btn-add-cart w-100" style="font-size: 0.9rem;" ${p.stock === 0 ? 'disabled' : ''}>${p.stock === 0 ? 'Out of Stock' : 'Add to Cart'}</button>
                    </div>
                `;

                // Add to Cart handler
                const cartBtn = card.querySelector('.btn-add-cart');
                cartBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    addToCart(p.id, 1);
                });

                // Remove from Wishlist handler
                const heartBtn = card.querySelector('.wishlist-btn');
                heartBtn.addEventListener('click', async (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    
                    const userId = localStorage.getItem('userId');
                    if (!userId) return;

                    try {
                        await fetchAPI(`/wishlist/remove/${userId}/${p.id}`, 'DELETE');
                        if (window.ShopNovaUI) {
                            ShopNovaUI.showToast('💔 Removed from Wishlist', 'info');
                            ShopNovaUI.playSound('ping');
                        }
                        // Instantly remove card with dynamic animation
                        card.style.transition = 'transform 0.3s ease, opacity 0.3s ease';
                        card.style.transform = 'scale(0.8)';
                        card.style.opacity = '0';
                        setTimeout(() => {
                            card.remove();
                            // If grid is empty, re-render
                            if (grid.children.length === 0) {
                                renderWishlist([]);
                            }
                        }, 300);
                        updateWishlistCount();
                    } catch (err) {
                        console.error('Failed to remove from wishlist', err);
                    }
                });

                grid.appendChild(card);
            });
        }
    </script>
</body>
</html>
