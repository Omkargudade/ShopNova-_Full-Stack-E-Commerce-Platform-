<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - ShopNova</title>
    <link rel="stylesheet" href="css/style.css">
    <style>
        .admin-layout {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 2rem;
            margin-top: 2rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: var(--white);
            border-radius: var(--border-radius);
            overflow: hidden;
            box-shadow: var(--box-shadow);
        }
        th, td {
            padding: 1rem;
            text-align: left;
            border-bottom: 1px solid var(--light-gray);
            color: var(--text-color);
        }
        th {
            background-color: var(--light-gray);
            font-weight: 600;
            color: var(--text-color);
        }
        .action-btns {
            display: flex;
            gap: 0.5rem;
        }
        .btn-sm {
            padding: 0.25rem 0.5rem;
            font-size: 0.875rem;
        }
        
        @media (max-width: 768px) {
            .admin-layout {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="nav-brand">ShopNova Admin</a>
        <div class="nav-links" id="auth-links">
            <!-- Populated by app.js -->
        </div>
    </nav>

    <div class="admin-wrapper">
        <aside class="admin-sidebar">
            <a href="admin-dashboard.html">📊 Dashboard</a>
            <a href="admin.html" class="active">📦 Manage Products</a>
            <a href="admin-orders.html">📜 Manage Orders</a>
            <a href="admin-users.html">👥 Manage Users</a>
            <a href="admin-reviews.html">💬 Manage Reviews</a>
            <a href="index.html">🏠 View Site</a>
            <div style="margin-top: auto; padding: 1rem;">
                <button onclick="logout()" class="btn btn-outline w-100" style="color: #ff4d4d; border-color: #ff4d4d;">Logout</button>
            </div>
        </aside>

        <main class="admin-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
                <h2>Product Management</h2>
                <div class="search-box">
                    <input type="text" id="productSearch" placeholder="Search products..." oninput="filterProducts()" style="padding: 0.5rem; border-radius: 4px; border: 1px solid #ddd;">
                </div>
            </div>
            
            <div class="admin-layout">
                <!-- Form Section -->
                <div class="form-container" style="margin: 0; max-width: 100%;">
                    <h3 id="form-title" style="margin-bottom: 1rem;">Add New Product</h3>
                    <form id="productForm">
                        <input type="hidden" id="productId">
                        <div class="form-group">
                            <label>Name</label>
                            <input type="text" id="pName" required>
                        </div>
                        <div class="form-group">
                            <label>Price (Rs.)</label>
                            <input type="number" step="0.01" id="pPrice" required>
                        </div>
                        <div class="form-group">
                            <label>Category</label>
                            <input type="text" id="pCategory" required>
                        </div>
                        <div class="form-group">
                            <label>Stock</label>
                            <input type="number" id="pStock" required>
                        </div>
                        <div class="form-group">
                            <label>Image Upload (Overrides URL if selected)</label>
                            <input type="file" id="pImageFile" accept="image/*">
                        </div>
                        <div class="form-group">
                            <label>Image URL (Optional)</label>
                            <input type="url" id="pImageUrl" oninput="document.getElementById('imagePreview').src = this.value || 'https://via.placeholder.com/150'">
                            <div style="margin-top: 0.5rem;">
                                <img id="imagePreview" src="https://via.placeholder.com/150" style="max-width: 150px; height: auto; border-radius: 4px; border: 1px solid #ddd;">
                            </div>
                        </div>
                        <div class="form-group">
                            <label>Description</label>
                            <textarea id="pDescription" rows="4" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 8px; font-family: inherit; resize: vertical;" required></textarea>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="submitBtn">Save Product</button>
                        <button type="button" class="btn btn-outline w-100 mt-3 hidden" id="cancelBtn" onclick="resetForm()">Cancel Edit</button>
                    </form>

                    <!-- Bulk Upload Section -->
                    <div style="margin-top: 3rem; padding: 2rem; border-top: 2px solid var(--light-gray); background: var(--light-gray); border-radius: 12px;">
                        <h3 style="margin-bottom: 0.5rem;">Bulk Product Upload</h3>
                        <p style="font-size: 0.9rem; color: #666; margin-bottom: 1.5rem;">
                            Upload a CSV file and its corresponding images. 
                            <br><strong>CSV Columns:</strong> name, price, category, image_name
                        </p>
                        
                        <div style="display: grid; gap: 1rem;">
                            <div class="form-group">
                                <label>1. Select All Product Images</label>
                                <input type="file" id="bulkImages" multiple accept="image/*" style="padding: 0.5rem; background: white;">
                            </div>
                            <div class="form-group">
                                <label>2. Select CSV File</label>
                                <input type="file" id="bulkCsv" accept=".csv" style="padding: 0.5rem; background: white;">
                            </div>
                            <button type="button" class="btn btn-secondary w-100" onclick="handleBulkUpload()" style="background: var(--dark-gray); color: white;">Start Bulk Upload</button>
                            <div id="bulkStatus" style="margin-top: 1rem; font-weight: 500; text-align: center;"></div>
                        </div>
                    </div>
                </div>

                <!-- List Section -->
                <div class="admin-table-card" style="overflow-x: auto;">
                    <table class="admin-table">
                        <thead>
                            <tr>
                                <th>Image</th>
                                <th>Name</th>
                                <th>Price</th>
                                <th>Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody id="admin-product-list">
                            <!-- Populated by JS -->
                        </tbody>
                    </table>
                </div>
            </div>
        </main>
    </div>

    <script src="js/api.js"></script>
    <script src="js/app.js"></script>
    <script src="js/admin.js"></script>
</body>
</html>
